title: "[Вопрос] "
body:
  - type: markdown
    attributes:
      value: |
        🙋 Поможем разобраться с приложением.
        Вопросы оплаты и личного доступа направляйте в https://t.me/blogWxP?direct.
        Не публикуйте коды, ключи и полный журнал.
  - type: input
    id: version
    attributes:
      label: Версия WxP и Windows
      placeholder: WxP 1.3.1, Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: С чем нужна помощь?
      description: Что хотите сделать, что уже попробовали и что получилось.
    validations:
      required: true
